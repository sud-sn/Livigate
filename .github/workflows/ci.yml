name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, security, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: levigate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d levigate" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy levigate
      - name: Static security analysis (fails on high severity)
        run: uv run bandit -q -r levigate -c pyproject.toml --severity-level high
      - name: Tests (SQLite + PostgreSQL guarantees)
        run: uv run pytest -q
        env:
          LEVIGATE_TEST_PG_URL: postgresql+asyncpg://ci:ci@localhost:5432/levigate
      - name: Dependency vulnerabilities
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --strict

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities (runtime, high and above)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end smoke (demo script)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          (cd backend && uv sync --frozen --no-dev)
          (cd frontend && npm ci && npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium)
      - name: Start a fresh demo environment
        env:
          LEVIGATE_ENV: demo
          LEVIGATE_SYNC_ENABLED: "false"
        run: |
          cd backend && uv run python -m levigate.demo.seed
          nohup uv run uvicorn levigate.main:app --port 8000 > /tmp/api.log 2>&1 &
          cd ../frontend && nohup npx vite --port 5173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && curl -sf localhost:5173 >/dev/null && break; sleep 1; done
      - name: Smoke test
        working-directory: frontend
        run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e/shots
          retention-days: 7

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --no-banner --redact

  images:
    name: Container images (build + scan)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t levigate-api:ci backend && docker build -t levigate-web:ci frontend
      - name: Scan API image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: levigate-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: levigate-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
