name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # The whole suite runs once per warehouse layout: Levigate's reference tables, a client's PMS tables landed by
    # Talend (mapped), and the same tables with expected amounts taken from the client's BI view.
    name: Backend (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [canonical, pms_snowflake, pms_snowflake_bi]
    env:
      LEVIGATE_TEST_PROFILE: ${{ matrix.profile }}
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: levigate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d levigate" --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Lint and format
        if: matrix.profile == 'canonical'
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        if: matrix.profile == 'canonical'
        run: uv run mypy levigate
      - name: Static security analysis (fails on high severity)
        if: matrix.profile == 'canonical'
        run: uv run bandit -q -r levigate -c pyproject.toml --severity-level high
      - name: Tests (SQLite + PostgreSQL guarantees; the canonical run also covers cross-layout and 50k load)
        run: uv run pytest -q
        env:
          LEVIGATE_TEST_PG_URL: postgresql+asyncpg://ci:ci@localhost:5432/levigate
      - name: Dependency vulnerabilities
        if: matrix.profile == 'canonical'
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt --strict

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerabilities (runtime and development tools, high and above)
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end (${{ matrix.profile }}) — demo script, role journeys, accessibility
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [canonical, pms_snowflake]
    env:
      LEVIGATE_ENV: demo
      LEVIGATE_SYNC_ENABLED: "false"
      LEVIGATE_SOURCE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          (cd backend && uv sync --frozen --no-dev)
          (cd frontend && npm ci && npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium)
      - name: Start a fresh demo environment
        run: |
          cd backend && uv run python -m levigate.demo.seed
          nohup uv run uvicorn levigate.main:app --port 8000 > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          # Bind to IPv4 explicitly: on the runner "localhost" resolves to ::1, but the tests browse 127.0.0.1
          cd ../frontend && nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf 127.0.0.1:8000/api/health && curl -sf 127.0.0.1:5173 >/dev/null && break; sleep 1; done
      - name: Smoke test (demo script)
        working-directory: frontend
        run: npm run e2e
      - name: Fresh demo for the role journeys (the reset replaces the databases, so the API restarts)
        run: |
          kill "$(cat /tmp/api.pid)" && sleep 1
          cd backend && uv run python -m levigate.demo.seed
          nohup uv run uvicorn levigate.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf 127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Role journeys and accessibility (WCAG 2.1 A/AA, light and dark)
        working-directory: frontend
        run: npm run e2e:journeys
      - name: Server logs
        if: failure()
        run: tail -n 80 /tmp/api.log /tmp/web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.profile }}
          path: frontend/e2e/shots
          retention-days: 7

  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source=/repo --no-banner --redact

  images:
    name: Container images (build + scan)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t levigate-api:ci backend && docker build -t levigate-web:ci frontend
      # Trivy's pinned container image (the old action tag is no longer published)
      - name: Scan images (fails on fixable high or critical vulnerabilities)
        run: |
          status=0
          for image in levigate-api:ci levigate-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
              image --no-progress --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image" || status=1
          done
          exit $status
